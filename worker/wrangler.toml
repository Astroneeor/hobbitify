name = "hobbitify-worker"
main = "src/index.ts"
compatibility_date = "2026-04-29"
compatibility_flags = ["nodejs_compat"]

# Public, non-secret runtime configuration.
# Override per-environment as needed.
[vars]
ALLOWED_ORIGIN = "http://localhost:5173"
SUPABASE_URL = "https://your-project.supabase.co"

# Per-IP rate limit applied inside the Worker.
# Defense-in-depth: pair with a dashboard Rate Limiting Rule on the Worker
# route for extra protection. Tightened a bit since auth + tier limits already
# cap real abuse.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Production environment example. Set the vars to your real values and run
# `wrangler deploy --env production`.
# Secrets (set via `wrangler secret put ... --env production`):
#   ANTHROPIC_API_KEY
#   TURNSTILE_SECRET_KEY
#   SUPABASE_JWT_SECRET
#   SUPABASE_SERVICE_ROLE_KEY
[env.production]
name = "hobbitify-worker"

[env.production.vars]
ALLOWED_ORIGIN = "https://hobbitify.pages.dev"
SUPABASE_URL = "https://your-project.supabase.co"

[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
